component:
  name: Commissioning
  nameEntity: commission
  namespace: App\Commissioning
  business_prefix: Commission
  subject_prefix: Commission
  database_prefix: commission_
  typed_layers_required: true
  service_interface_mirror: true
  enabled_rules:
    - structure.forbidden_architecture
    - namespace.profile_match
    - layer.typed_class_location
    - mirror.service_interface
    - composer.platform_constraint
    - database.table_prefix
    - route.owner_token
    - route.owner_root
    - route.path_segment_separation
    - mutation.safety_firewall
    - security.secret_leak
    - documentation.docblock_preservation
    - inventory.component_surface

  route_owner_root: commissioning
  route_owner_roots:
    - commissioning
  mutation_mode: explicit

  secret_scan: enabled
  docblock_preservation: enabled
  release:
    evidence_required: false
    required_files:
      - composer.json
      - composer.prod.json

suppressions:
  canon.001.technical_role_first:
    - src/Calculator/
    - src/CalculatorInterface/
    - src/EntityInterface/
    - src/Listener/
    - src/ResolverInterface/
